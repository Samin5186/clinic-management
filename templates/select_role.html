{% extends 'base.html' %}

{% block title %}Select Role{% endblock %}

{% block content %}
<div class="page-container">
    <h2>Select Your Role</h2>
    <p class="subtitle">Please select how you want to log in</p>
    <div class="role-cards">
        <a href="{% url 'login' %}?role=patient" class="role-card">
            <div class="role-icon">🧑</div>
            <h3>Patient</h3>
            <p>Book appointments and manage your health</p>
        </a>
        <a href="{% url 'login' %}?role=doctor" class="role-card">
            <div class="role-icon">👨‍⚕️</div>
            <h3>Doctor</h3>
            <p>View your appointments</p>
        </a>
        <a href="{% url 'login' %}?role=admin" class="role-card">
            <div class="role-icon">🔐</div>
            <h3>Admin</h3>
            <p>Manage clinic system</p>
        </a>
    </div>
    <div class="back-link">
        <a href="{% url 'home' %}">Back to Home</a>
    </div>
</div>
{% endblock %}
